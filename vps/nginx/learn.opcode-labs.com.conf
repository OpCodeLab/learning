# learn.opcode-labs.com: OpCode Learn. Own site file and certificate; nothing else on the VPS changes.
# Installed to /etc/nginx/sites-available/ by vps/install.sh.

limit_req_zone $binary_remote_addr zone=learn_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name learn.opcode-labs.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name learn.opcode-labs.com;

    ssl_certificate     /etc/letsencrypt/live/learn.opcode-labs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.opcode-labs.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/learn.opcode-labs.com.access.log;
    error_log  /var/log/nginx/learn.opcode-labs.com.error.log;

    client_max_body_size 1m;    # forms and progress pings only; no uploads here

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Brute force: 10 sign-in attempts per minute per IP (the app also locks out).
    location = /login      { limit_req zone=learn_auth burst=10 nodelay; proxy_pass http://127.0.0.1:8095; }
    location = /login/code { limit_req zone=learn_auth burst=10 nodelay; proxy_pass http://127.0.0.1:8095; }
    location /invite/      { limit_req zone=learn_auth burst=10 nodelay; proxy_pass http://127.0.0.1:8095; }

    location /static/ {
        proxy_pass http://127.0.0.1:8095;
        expires 1d;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
    }

    # Course files, straight from the VPS disk (NVMe). Only reachable through X-Accel-Redirect
    # from the app, after it checked the student's access (every request, every seek).
    # Clients can't call it directly. Range requests (seeking) are handled by nginx.
    location /_media/raw/ {
        internal;
        alias /srv/learn/courses/;
        sendfile on;
        tcp_nopush on;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
