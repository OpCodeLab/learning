<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/static/logo.svg" alt="" width="28" height="28"><span>{{ site_name }}</span></a>
  {% if user %}
  <nav>
    <a href="/">My courses</a>
    {% if user.is_admin %}<a href="/admin">Students</a><a href="/admin/courses">Courses</a>{% endif %}
    <a href="/account">Account</a>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ session.csrf }}">
      <button class="link">Sign out</button>
    </form>
  </nav>
  {% endif %}
</header>
<main class="{% block mainclass %}page{% endblock %}">
{% block content %}{% endblock %}
</main>
</body>
</html>
