{% extends "base.html" %}
{% block title %}Sign in · {{ site_name }}{% endblock %}
{% block mainclass %}narrow{% endblock %}
{% block content %}
<form method="post" action="/login" class="card form">
  <h1>Sign in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <label>Email<input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus></label>
  <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
  <button class="primary">Sign in</button>
  <p class="muted small">Forgot your password? Ask your trainer for a new access link.</p>
</form>
{% endblock %}
